# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # strict-casts is what would have caught the `e.error as Failure` cast that
    # silently degraded every error to UnknownFailure.
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Promoted from warning to error: these break the build rather than
    # accumulating in the log.
    missing_required_param: error
    missing_return: error
    unused_import: error
    unused_local_variable: error
    dead_code: error
    invalid_use_of_protected_member: error
    body_might_complete_normally_nullable: error

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.config.dart"
    - "lib/core/localization/l10n/app_localizations*.dart"

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_empty_else
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - comment_references
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    # sort_pub_dependencies is deliberately off: pubspec.yaml groups
    # dependencies by purpose, which reads better than one alphabetical list.
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_await_in_return
    - unnecessary_parenthesis
    - use_build_context_synchronously
