name: nasam
description: Fleet management application for real-time vehicle tracking.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0

  # flavour
  flutter_flavorizr: ^2.5.0

  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Immutability & Code Generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Functional Error Handling
  dartz: ^0.10.1

  # Networking
  dio: ^5.4.3
  connectivity_plus: ^6.0.3

  # Real-time
  web_socket_channel: ^3.0.1

  # Navigation
  go_router: ^13.2.0

  # Responsive UI
  flutter_screenutil: ^5.9.1

  # Security
  flutter_secure_storage: ^9.2.2
  flutter_dotenv: ^5.1.0

  # Local Storage
  shared_preferences: ^2.2.3

  # Utilities
  logger: ^2.3.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.9
  freezed: ^3.2.5
  json_serializable: ^6.8.0
  injectable_generator: ^3.0.2

  # Testing
  mocktail: ^1.0.3
  bloc_test: ^10.0.0
  faker: ^2.1.0

  # Linting
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env

flavorizr:
  flavors:
    staging:
      app:
        name: "Nasam Staging"
      ios:
        bundleId: "com.nasam.staging"
        generateDummyAssets: false
        # icon: "assets/icon/icon.png"
        firebase:
          config: ".firebase/staging/GoogleService-Info.plist"
        variables:
          API_BASE_URL:
            value: "https://api-stage.nasam.app/v1"
    dev:
      app:
        name: "Nasam Dev"

      ios:
        bundleId: "com.nasam.dev"
        generateDummyAssets: false
        # icon: "assets/icon/icon.png"
        firebase:
          config: ".firebase/dev/GoogleService-Info.plist"
        variables:
          API_BASE_URL:
            value: "https://api-dev.nasam.app/v1"

    prod:
      app:
        name: "NASAM"
      ios:
        bundleId: "com.nasam.sts"
        generateDummyAssets: false
        # icon: "assets/icon/icon.png"
        firebase:
          config: ".firebase/production/GoogleService-Info.plist"
        variables:
          API_BASE_URL:
            value: "https://api.nasam.app/v1"