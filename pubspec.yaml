name: nasam
description: Fleet management application for real-time vehicle tracking.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0

  # Dependency Injection
  get_it: ^9.2.1

  # Immutability & Code Generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Functional Error Handling
  dartz: ^0.10.1
  pinput: ^6.0.2
  flutter_svg: ^2.3.0
  characters: ^1.4.1
  # POI Excel import/export and native document picker.
  archive: ^4.0.9
  xml: ^6.6.1
  file_picker: ^10.3.10

  # Networking
  dio: ^5.4.3
  connectivity_plus: ^6.0.3

  # Real-time
  web_socket_channel: ^3.0.1

  # Navigation
  go_router: ^13.2.0

  # Responsive UI
  flutter_screenutil: ^5.9.1

  # Security
  flutter_secure_storage: ^9.2.2

  # Local Storage
  shared_preferences: ^2.2.3

  # Utilities
  logger: ^2.3.0
  intl: ^0.20.2
  hijri: ^3.0.1
  flutter_advanced_drawer: ^1.5.0
  google_maps_flutter: ^2.18.1
  # A fork of bpillon/google_maps_cluster_manager 3.1.0 (the pub release).
  # google_maps_flutter_platform_interface now exports its own `Cluster` and
  # `ClusterManager` (native clustering), so upstream 3.1.0 no longer
  # compiles against it: the names collide. The fork's only changes that
  # matter here are `hide Cluster` / `hide ClusterManager` on that import
  # (plus an unused `ClusterItem.shouldCluster` hook). Upstream report:
  # https://github.com/bpillon/google_maps_cluster_manager/issues/58 (open;
  # the error is in a screenshot, so match it before relying on it).
  # Pinned to a SHA, not `master`, so a new push to the fork cannot
  # change the build. Drop the fork when upstream publishes a fix.
  google_maps_cluster_manager:
    git:
      url: https://github.com/DanielSchmerber/google_maps_cluster_manager.git
      ref: 7553a42cb0d95cecad40349fa01fde5cac55719d

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.9
  freezed: ^3.2.5
  json_serializable: ^6.8.0

  # Testing
  mocktail: ^1.0.3
  bloc_test: ^10.0.0
  faker: ^2.1.0

  # Linting
  flutter_lints: ^6.0.0

  # flavour
  flutter_flavorizr: ^2.5.0
  fake_async: ^1.3.3
  google_maps_flutter_platform_interface: ^2.17.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    # TODO(api): tracking fixtures, served by TrackingFixtureDataSource until the
      # tracking API is delivered. Remove with it.
    - assets/fixtures/tracking/
    - assets/fixtures/play_back/
    - assets/fixtures/poi/
    - assets/fixtures/geofence/

  # Almarai is SIL OFL 1.1; assets/fonts/OFL.txt is the licence, and it ships
  # with the font as that licence requires. The family carries only 400 and
  # 700 upstream, which is why AppTypography has no true semibold.
  fonts:
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai-Regular.ttf
          weight: 400
        - asset: assets/fonts/Almarai-Bold.ttf
          weight: 700

