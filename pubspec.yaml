name: nasam
description: Fleet management application for real-time vehicle tracking.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0

  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Immutability & Code Generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Functional Error Handling
  dartz: ^0.10.1
  flutter_svg: ^2.3.0
  # Networking
  dio: ^5.4.3
  connectivity_plus: ^6.0.3

  # Real-time
  web_socket_channel: ^3.0.1

  # Navigation
  go_router: ^13.2.0

  # Responsive UI
  flutter_screenutil: ^5.9.1

  # Security
  flutter_secure_storage: ^9.2.2

  # Local Storage
  shared_preferences: ^2.2.3

  # Utilities
  logger: ^2.3.0
  intl: ^0.20.2
  hijri: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.9
  freezed: ^3.2.5
  json_serializable: ^6.8.0
  injectable_generator: ^3.0.2

  # Testing
  mocktail: ^1.0.3
  bloc_test: ^10.0.0
  faker: ^2.1.0

  # Linting
  flutter_lints: ^6.0.0

  # flavour
  flutter_flavorizr: ^2.5.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
