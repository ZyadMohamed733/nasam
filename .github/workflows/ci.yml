name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.3"

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          git diff --exit-code || {
            echo "::error::Generated code is stale. Run build_runner and gen-l10n, then commit."
            exit 1
          }

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      # Goldens are excluded: they are rendered by the host font stack and are
      # generated on macOS, so a Linux runner produces different pixels.
      # Run them locally with `flutter test --tags golden`.
      - name: Test
        run: flutter test --coverage --exclude-tags golden

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info

  build-android:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The step that would have caught both the debug-keystore signing config
      # and the INTERNET permission missing from the main manifest, neither of
      # which reproduces in a debug build.
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build prod release APK
        run: |
          flutter build apk --release --flavor prod \
            -t lib/main_prod.dart \
            --dart-define-from-file=config/prod.json

      - name: Assert INTERNET permission survived the manifest merge
        run: |
          merged=$(find build/app/intermediates/merged_manifests -name AndroidManifest.xml | head -1)
          echo "Checking $merged"
          grep -q 'android.permission.INTERNET' "$merged" || {
            echo "::error::INTERNET permission missing from the merged release manifest."
            exit 1
          }

      - name: Assert the release APK is not debug-signed
        run: |
          apk=$(find build/app/outputs -name "*-prod-release.apk" | head -1)
          if unzip -p "$apk" META-INF/*.RSA 2>/dev/null | keytool -printcert 2>/dev/null | grep -qi "CN=Android Debug"; then
            echo "::error::Release APK is signed with the Android debug key."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: prod-release-apk
          path: build/app/outputs/flutter-apk/*.apk
